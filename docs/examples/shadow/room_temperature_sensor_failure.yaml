schema_version: 1
scenario_id: room_temperature_sensor_failure
name: Room temperature sensor failure
description: A valid room measurement becomes unavailable while the runtime continues.
tags:
  - heating
  - sensor-failure
module: heating
module_contract_version: 1
start_at: 2026-01-15T08:00:00Z

configuration:
  zone_id: living_room
  zone_name: Living room
  sensor_id: living_room_temperature
  sensor_name: Living room temperature
  target_temperature: 21.0
  primary_measurement_max_age: 30m
  max_future_skew: 1m
  indeterminate_grace_period: 5m
  indeterminate_timeout_action: disable_heating
  heating_turn_on_differential: 0.2
  heating_turn_off_differential: 0.2
  heat_demand_confirmation_duration: 0s
  minimum_heating_on_time: 0s
  minimum_heating_off_time: 0s

initial_state:
  zone_temperature: 19.5
  zone_temperature_observed_at: 2026-01-15T08:00:00Z

timeline:
  - at: 0m
    event:
      type: runtime.start

  - at: 10m
    event:
      type: sensor.availability_changed
      subject: living_room_temperature
      payload:
        availability: unavailable
        observed_at: 2026-01-15T08:10:00Z

expectations:
  - type: operational_event.exists
    event_code: measurement_became_unavailable

  - type: run.no_unhandled_error
