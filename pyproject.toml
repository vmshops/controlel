[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"


[project]
name = "controlel"
version = "0.1.0"
description = "Platform-independent heating control core for Home Assistant and other hosts"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    {name = "vmshops"}
]
dependencies = [
    "pydantic>=2.0"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Software Development :: Libraries :: Python Modules"
]


[project.urls]
Source = "https://github.com/vmshops/controlel"
Issues = "https://github.com/vmshops/controlel/issues"
Documentation = "https://github.com/vmshops/controlel/tree/main/docs"


[tool.setuptools]
include-package-data = false


[tool.setuptools.packages.find]
where = ["src"]
include = ["controlel*"]


[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy"
]


[tool.ruff]
line-length = 120
target-version = "py313"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP"
]


[tool.mypy]
python_version = "3.13"
strict = true


[tool.pytest.ini_options]
# Home Assistant's asyncio auto mode is scoped to the isolated framework conftest.
testpaths = [
    "tests"
]
