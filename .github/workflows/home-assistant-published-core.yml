name: Home Assistant published Core compatibility

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-assistant-published-core:
    runs-on: ubuntu-latest
    env:
      CONTROLEL_FRAMEWORK_COMPOSITION: public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/ha-test.txt

      - name: Verify Python version
        run: python -c "import sys; assert sys.version_info >= (3, 14, 2), sys.version"

      - name: Install locked Home Assistant test dependencies
        run: python -m pip install --require-hashes -r requirements/ha-test.txt

      - name: Install Core requirement declared by the HA manifest from PyPI
        run: |
          core_requirement="$(python -c 'import json; print(json.load(open("custom_components/controlel/manifest.json"))["requirements"][0])')"
          python -m pip install --no-cache-dir "${core_requirement}"

      - name: Verify Home Assistant published Core composition
        run: python scripts/ci/verify_public_core.py

      - name: Run Home Assistant adapter tests
        run: |
          python -m pytest \
            tests/integrations/home_assistant \
            --asyncio-mode=auto \
            --ignore=tests/integrations/home_assistant/framework

  home-assistant-framework-published-core:
    runs-on: ubuntu-latest
    env:
      CONTROLEL_FRAMEWORK_COMPOSITION: public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/ha-test.txt

      - name: Verify Python version
        run: python -c "import sys; assert sys.version_info >= (3, 14, 2), sys.version"

      - name: Install locked Home Assistant test dependencies
        run: python -m pip install --require-hashes -r requirements/ha-test.txt

      - name: Install Core requirement declared by the HA manifest from PyPI
        run: |
          core_requirement="$(python -c 'import json; print(json.load(open("custom_components/controlel/manifest.json"))["requirements"][0])')"
          python -m pip install --no-cache-dir "${core_requirement}"

      - name: Verify Home Assistant published Core composition
        run: python scripts/ci/verify_public_core.py

      - name: Run Home Assistant framework tests
        run: python -m pytest tests/integrations/home_assistant/framework
