name: Tests

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  core-and-adapters:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff -r requirements/package-test.txt

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Run dependency-free tests
        run: python -m pytest --ignore=tests/integrations/home_assistant/framework

  home-assistant-framework:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/ha-test.txt

      - name: Verify Python version
        run: |
          python -c "import sys; assert sys.version_info >= (3, 14, 2), sys.version"

      - name: Install locked Home Assistant test dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ha-test.txt
          python -m pip install --no-deps -e .

      - name: Run Home Assistant framework tests
        run: python -m pytest tests/integrations/home_assistant/framework
