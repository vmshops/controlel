name: Integration release validation

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  schedule:
    - cron: "17 3 * * 1"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Build deterministic HACS release archive
        run: python scripts/packaging/build_hacs_release.py --version 0.4.0

      - name: Validate HACS release archive
        run: |
          python scripts/packaging/validate_hacs_release.py \
            dist/hacs/controlel.zip \
            --version 0.4.0 \
            --checksum dist/hacs/controlel.zip.sha256

      - name: Upload inspection artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: controlel-hacs-release-candidate
          path: |
            dist/hacs/controlel.zip
            dist/hacs/controlel.zip.sha256
          if-no-files-found: error
          retention-days: 7

  hacs:
    runs-on: ubuntu-latest

    steps:
      - name: Run HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          ignore: brands

  hassfest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@e3fb68ebda13d88a0d695082f471ba2c83d025fb
