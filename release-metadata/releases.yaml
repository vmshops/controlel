    title: "Controlel Home Assistant integration 0.12.0"
    version: "0.12.0"
    status: candidate
    tag: null
    commit_sha: null
    summary: "Host-facing resumable Setup backend over the Core 0.12.0 setup authority"
    highlights:
      - "Read-only HA registry discovery and exact registry-ID resolution"
      - "Transparent Heating recommendations, incomplete drafts, validation, and non-active canonicalization"
