    summary: "Observational anomaly, deterministic Shadow simulation, and Setup/Discovery/Import foundations"
    highlights:
      - "Observational anomaly lifecycle remains isolated from control decisions"
      - "Deterministic Shadow Runtime v0.1 and reproducible bounded soak validation"
      - "Module-neutral Setup authority, HA discovery/resolution, and resumable Heating setup host APIs"
