<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="page.title_app">Controlel (Prototype)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app">
    <aside class="app__sidebar">
      <div class="app__brand">
        <span class="app-logo" aria-hidden="true">C</span>
        <div>
          <h1 class="app__name">Controlel</h1>
          <p class="app__tagline" data-i18n="panel.tagline">Heating control platform</p>
        </div>
      </div>
      <div id="app-nav" class="app__nav"></div>
      <div class="app__sidebar-footer">
        <p id="app-mode" class="app__mode">Frontend API v1</p>
        <p data-i18n="panel.readonly_footer">Observability UI · read-only · configure in Home Assistant</p>
      </div>
    </aside>

    <div class="app__main">
      <header class="app__topbar">
        <span class="app__topbar-label" data-i18n="panel.overall_status">Overall status</span>
        <span id="topbar-status" class="app__topbar-status"></span>
      </header>

      <main id="view-root" class="app__content"></main>

      <!-- Setup view: wizard.js consumes the real Setup Write API v1 contract. -->
      <div id="wizard-view" class="app__content app__content--wizard" hidden>
        <div id="draft-status" class="draft-status" hidden></div>
        <footer id="wizard-footer" class="wizard-footer"></footer>
        <nav id="stepper" class="stepper" aria-label="Setup steps"></nav>
        <section id="step-panel" class="step-panel" aria-live="polite"></section>
      </div>

      <div id="water-wizard-view" class="app__content app__content--wizard" hidden>
        <div id="water-draft-status" class="draft-status" hidden></div>
        <footer id="water-wizard-footer" class="wizard-footer"></footer>
        <nav id="water-stepper" class="stepper" aria-label="Water Safety setup steps"></nav>
        <section id="water-step-panel" class="step-panel" aria-live="polite"></section>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="mock-app-data.js"></script>
  <script src="api-client.js"></script>
  <script src="components.js"></script>
  <script src="wizard.js"></script>
  <script src="water-wizard.js"></script>
  <script src="app.js"></script>
</body>
</html>
