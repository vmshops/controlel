<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controlel ÔÇö Water Safety Setup</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="app-title">
      <span class="app-logo" aria-hidden="true">C</span>
      <div>
        <h1 data-i18n="page.wizard_header">Controlel Setup</h1>
        <p class="app-subtitle">Water Safety module ┬Ě Real backend setup drafts ┬Ě No activation</p>
        <p class="app-subtitle"><a href="wizard.html">Heating setup wizard</a> ┬Ě <a href="index.html">App shell</a></p>
      </div>
    </div>
    <div id="water-draft-status" class="draft-status" hidden></div>
  </header>

  <main class="wizard">
    <nav id="water-stepper" class="stepper" aria-label="Setup steps"></nav>
    <section id="water-step-panel" class="step-panel" aria-live="polite"></section>
    <footer id="water-wizard-footer" class="wizard-footer"></footer>
  </main>

  <script src="i18n.js"></script>
  <script src="api-client.js"></script>
  <script src="components.js"></script>
  <script src="water-wizard.js"></script>
  <script>
    const setupEnvironment = window.CA_API.detectHaEnvironment(window);
    const unavailable = () => Promise.reject(
      new window.CA_API.ApiError("disconnected", "No authenticated Home Assistant setup connection is available")
    );
    const setupClient = setupEnvironment.available
      ? window.CA_API.createSetupWriteClient({
          connection: setupEnvironment.connection,
          configEntryId: setupEnvironment.configEntryId,
          moduleKey: "water_safety",
        })
      : {
          discover: unavailable,
          recommendations: unavailable,
          startDraft: unavailable,
          reopenDraft: unavailable,
          updateDraft: unavailable,
          validateDraft: unavailable,
        };
    window.CONTROLEL_WATER_SETUP_WIZARD = window.CA_WATER_WIZARD.createSetupWaterWizard({
      client: setupClient,
      configEntryId: setupEnvironment.configEntryId || "unavailable",
      root: document,
      storage: window.localStorage,
    });

    if (window.CI18N && typeof window.CI18N.applyI18n === "function") {
      window.CI18N.applyI18n(document);
    }
  </script>
</body>
</html>
